name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck
        run: find . -name '*.sh' | xargs shellcheck -S warning

  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check jq is available
        run: jq --version

      - name: Check all scripts are executable
        run: |
          failed=0
          for f in repo-understand.sh benchmark/benchmark.sh benchmark/report.sh; do
            if [ ! -x "$f" ]; then
              echo "FAIL: $f is not executable"
              failed=1
            fi
          done
          exit $failed

      - name: Bash syntax check
        run: |
          find . -name '*.sh' -print0 | while IFS= read -r -d '' f; do
            echo "Checking $f..."
            bash -n "$f"
          done
          echo "All scripts pass syntax check"

      - name: Full run on this repo
        run: |
          chmod +x repo-understand.sh
          ./repo-understand.sh .

      - name: Verify output
        run: |
          test -f repo-understand.manifest.json
          echo "manifest exists"
          jq -e '.version' repo-understand.manifest.json
          echo "manifest is valid JSON with version field"
          test -f docs/architecture/overview.md
          echo "overview.md exists"
          test -f docs/architecture/tech-stack.md
          echo "tech-stack.md exists"
          test -f docs/architecture/directory-map.md
          echo "directory-map.md exists"
