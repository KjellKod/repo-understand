name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck
        run: find . -name '*.sh' -not -path './.git/*' -not -path './.ws/*' -print0 | xargs -0 shellcheck -S warning

  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history needed for git-insights analyzer

      - name: Check jq is available
        run: jq --version

      - name: Check all scripts are executable
        run: |
          failed=0
          for f in repo-understand.sh benchmark/benchmark.sh benchmark/report.sh; do
            if [ ! -x "$f" ]; then
              echo "FAIL: $f is not executable"
              failed=1
            fi
          done
          exit $failed

      - name: Bash syntax check
        run: |
          failed=0
          while IFS= read -r -d '' f; do
              echo "Checking $f..."
              bash -n "$f" || failed=1
          done < <(find . -name '*.sh' -not -path './.git/*' -not -path './.ws/*' -print0)
          [ "$failed" -eq 0 ] || { echo "Syntax check failed"; exit 1; }
          echo "All scripts pass syntax check"

      - name: Full run on this repo
        timeout-minutes: 5
        run: ./repo-understand.sh .

      - name: Verify output
        run: |
          test -s repo-understand.manifest.json
          echo "manifest exists and is non-empty"
          jq -e '.generated_at' repo-understand.manifest.json
          echo "manifest is valid JSON with expected fields"
          test -s docs/architecture/overview.md
          test -s docs/architecture/tech-stack.md
          test -s docs/architecture/directory-map.md
          test -s agents-content.md
          test -s doc-structure.md
          echo "all generated artifacts exist and are non-empty"
